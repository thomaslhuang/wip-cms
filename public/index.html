<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>w·i·p cms</title>
  <!-- the theme's colors before anything draws, so it doesn't flash (js/theme.js has the themes) -->
  <script>
    try {
      const m = localStorage.getItem("wip-theme") || "system";
      const boot = JSON.parse(localStorage.getItem("wip-theme-boot") || "null");
      const dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      const t = boot && boot[dark ? "dark" : "light"];
      const root = document.documentElement;
      if (t) { root.dataset.theme = t.kind; root.dataset.code = t.code; for (const k in t.vars) root.style.setProperty(k, t.vars[k]); }
      else root.dataset.theme = dark ? "dark" : "light";
      root.style.setProperty("--ui-scale", String((Number(localStorage.getItem("wip-ui-scale")) || 100) / 100));
    } catch {}
  </script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/markdown-it.js"></script>
</head>
<body>
  <!--
    The window, left to right (js/app.js fills each part):
      sidebar     your site's sections and pages
      list        the posts in the chosen section
      main        toolbar, then the document and/or live preview, and the inspector
  -->
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Sections"></aside>
    <section id="list" class="list" aria-label="Posts"></section>
    <main class="main">
      <header id="toolbar" class="toolbar"></header>
      <div class="workspace">
        <div id="stage" class="stage">
          <div id="docpane" class="docpane"></div>
          <div id="divider" class="divider" role="separator" aria-label="Resize preview"></div>
          <div id="previewpane" class="previewpane"></div>
        </div>
        <aside id="inspector" class="inspector" aria-label="Details"></aside>
      </div>
      <div id="phonebar" class="phonebar"></div>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
