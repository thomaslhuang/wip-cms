<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wip cms</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/markdown-it.js"></script>
</head>
<body>
  <!-- top bar: site, what's open, Window menu, and the buttons for what's open (js/app.js) -->
  <header class="topbar">
    <button id="site-name" class="site-name" title="Open another site">wip cms</button>
    <div id="crumbs" class="crumbs"></div>
    <div id="actions" class="actions"></div>
    <div class="menu-wrap">
      <button id="window-btn" class="btn ghost" title="Show, hide and arrange panels">Window</button>
      <div id="window-menu" class="menu" hidden></div>
    </div>
  </header>
  <!-- the panels (js/dock.js) -->
  <main id="dock" class="dock"></main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
